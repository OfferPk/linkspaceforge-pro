<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" fill="#060b16"/>
  <text x="40" y="46" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="bold">LinkSpaceForge Pro v1.0.0 — ECSS-E-ST-50-05C Rev.2 &amp; CCSDS 401.0-B Architecture</text>
  <text x="40" y="70" fill="#94a3b8" font-family="monospace" font-size="13">Spacecraft EIRP • Free Space Path Loss (FSPL) • G/T Figure of Merit • Eb/N0 Link Margin</text>

  <rect x="40" y="110" width="260" height="175" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="58" y="140" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">1. SPACECRAFT TRANSMITTER</text>
  <text x="58" y="164" fill="#e2e8f0" font-family="monospace" font-size="12">CCSDS 401.0-B Clause 2.2</text>
  <text x="58" y="188" fill="#94a3b8" font-family="monospace" font-size="11">• P_tx: RF Output (W &amp; dBW)</text>
  <text x="58" y="208" fill="#94a3b8" font-family="monospace" font-size="11">• Feeder &amp; Diplexer Loss L_tx</text>
  <text x="58" y="228" fill="#94a3b8" font-family="monospace" font-size="11">• Antenna Gain G_tx (dBi)</text>
  <text x="58" y="248" fill="#34d399" font-family="monospace" font-size="11">• EIRP = P_tx - L_tx + G_tx</text>

  <rect x="40" y="315" width="260" height="175" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <text x="58" y="345" fill="#34d399" font-family="monospace" font-size="14" font-weight="bold">2. PROPAGATION CHANNEL</text>
  <text x="58" y="369" fill="#e2e8f0" font-family="monospace" font-size="12">ITU-R P.618 &amp; P.676</text>
  <text x="58" y="393" fill="#94a3b8" font-family="monospace" font-size="11">• FSPL = 20·log10(4πd/λ)</text>
  <text x="58" y="413" fill="#94a3b8" font-family="monospace" font-size="11">• Atmospheric Gas Loss L_atm</text>
  <text x="58" y="433" fill="#94a3b8" font-family="monospace" font-size="11">• Rain &amp; Cloud Attenuation</text>
  <text x="58" y="453" fill="#38bdf8" font-family="monospace" font-size="11">• Pointing &amp; Polarization Loss</text>

  <rect x="360" y="110" width="260" height="380" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="378" y="140" fill="#fbbf24" font-family="monospace" font-size="14" font-weight="bold">3. GROUND STATION G/T</text>
  <text x="378" y="164" fill="#e2e8f0" font-family="monospace" font-size="12">Receiver Sensitivity</text>
  <text x="378" y="192" fill="#94a3b8" font-family="monospace" font-size="11">• Dish Diameter D (m) &amp; η_rx</text>
  <text x="378" y="214" fill="#94a3b8" font-family="monospace" font-size="11">• G_rx = 10·log10(η(πD/λ)²)</text>
  <text x="378" y="236" fill="#94a3b8" font-family="monospace" font-size="11">• T_sys = T_ant + T_LNA + T_feed</text>
  <text x="378" y="258" fill="#94a3b8" font-family="monospace" font-size="11">• G/T = G_rx - 10·log10(T_sys)</text>
  <text x="378" y="294" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Carrier Spectral Density:</text>
  <text x="378" y="318" fill="#94a3b8" font-family="monospace" font-size="11">• C/N0 = EIRP - Loss + G/T - kB</text>
  <text x="378" y="340" fill="#94a3b8" font-family="monospace" font-size="11">• kB = -228.60 dBW/(Hz·K)</text>
  <text x="378" y="362" fill="#34d399" font-family="monospace" font-size="11">• Carrier Lock: C/N0 &ge; 60 dB-Hz</text>

  <rect x="680" y="110" width="240" height="380" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <text x="698" y="140" fill="#c084fc" font-family="monospace" font-size="14" font-weight="bold">4. LINK MARGIN POLICY</text>
  <text x="698" y="164" fill="#e2e8f0" font-family="monospace" font-size="12">ECSS-E-ST-50-05C Clause 5</text>
  <text x="698" y="196" fill="#94a3b8" font-family="monospace" font-size="11">• Eb/N0 = C/N0 - 10·log10(R_b)</text>
  <text x="698" y="220" fill="#94a3b8" font-family="monospace" font-size="11">• Required Eb/N0 + L_impl</text>
  <text x="698" y="244" fill="#94a3b8" font-family="monospace" font-size="11">• Nominal Margin &ge; +3.0 dB</text>
  <text x="698" y="268" fill="#94a3b8" font-family="monospace" font-size="11">• Critical/LEOP &ge; +6.0 dB</text>
  <text x="698" y="304" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">10/10 Normative Auditor</text>
  <text x="698" y="328" fill="#94a3b8" font-family="monospace" font-size="11">• ECSS XML Manifest Export</text>

  <line x1="300" y1="195" x2="360" y2="195" stroke="#38bdf8" stroke-width="3"/>
  <line x1="300" y1="400" x2="360" y2="400" stroke="#34d399" stroke-width="3"/>
  <line x1="620" y1="295" x2="680" y2="295" stroke="#fbbf24" stroke-width="3"/>
</svg>
